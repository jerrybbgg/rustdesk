name: Build Custom RustDesk Client

on:
  push:
    branches: [ "master", "main" ] # 當你推送程式碼到 master 分支時觸發
  workflow_dispatch: # 允許你在 GitHub 網頁上手動點擊執行

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Clang and LLVM
      uses: egor-tensin/setup-clang@v1
      with:
        version: latest
        platform: x64

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: x86_64-pc-windows-msvc

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x' # 自動採用最新的 Flutter 3 版本
        channel: 'stable'
        cache: true

    - name: Install Vcpkg & Dependencies
      run: |
        vcpkg integrate install
        # RustDesk 編譯所需的 Windows 依賴庫（如 libvpx, opus 等）
        # 官方通常內建了 vcpkg.json，此處會自動下載

    - name: Build Rust Backend
      run: |
        # 執行 Cargo 編譯產出橋接庫
        cargo build --release

    - name: Build Flutter Frontend (Windows)
      run: |
        flutter pub get
        flutter build windows --release

    - name: Package Artifacts
      shell: bash
      run: |
        # 將編譯好的 exe 與相關 dll 收集到一個資料夾或直接提取主程式
        mkdir output
        cp build/windows/runner/Release/* output/
        # 重新命名為你的專案名稱
        mv output/rustdesk.exe output/MyCustomRustDesk.exe

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Custom-RustDesk-Windows
        path: output/
